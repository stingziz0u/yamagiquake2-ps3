//
// This is an alternate startup script
// for Yamagi Quake II, overriding the
// default.cfg from pak0.pak. 
//
// !!! PLEASE DO NOT ALTER THIS FILE !!!
//
// Instead, put your custom stuff in
// autoexec.cfg. It's also executed
// at startup.
//

//
// KEY BINDINGS
//

unbindall

bind	1		"use Blaster"
bind	2		"use Shotgun"
bind	3		"use Super Shotgun"
bind	4		"use Machinegun"
bind	5		"use Chaingun"
bind	6		"use Grenade Launcher"
bind	7		"use Rocket Launcher"
bind	8		"use HyperBlaster"
bind	9		"use Railgun"
bind	0		"use BFG10K"

bind	MOUSE1		+attack

bind	d		+back
bind	e		+forward
bind	s		+moveleft
bind	a		+left
bind	f		+moveright
bind	g		+right

bind	TAB		inven
bind	ENTER		invuse
bind	o		invprev
bind	p		invnext
bind	BACKSPACE	invdrop

bind	MWHEELDOWN	weapprev
bind	MWHEELUP	weapnext

bind	q		"use quad damage"
bind	w		"use power shield"

bind	SHIFT		+speed

bind	SPACE		+movedown
bind	MOUSE2		+moveup

bind	PAUSE		pause

bind	F1		"cmd help"
bind	F5		"echo Quick Saving...; wait; save quick"
bind	F9		"echo Quick Loading...; wait; load quick"
bind	F12		screenshot jpg 90

bind	t		messagemode

//----------------------------------------------

//
// DEFAULT CVARS
//

set	viewsize	100
set	vid_fullscreen	0
set	sensitivity	3
set	crosshair	1
set	cl_run		1
set	hand		0
set	m_pitch		0.022
set	m_yaw		0.022
set	m_forward	1
set	m_side		0.8
set	lookspring	0
set	lookstrafe	0
set	freelook	1

//----------------------------------------------

//
// PLAYSTATION 3 (Quake2PS3)
//
// Everything below can be changed in the menus (Options, Gamepad,
// Customize Buttons, Video). The changes go to config.cfg in
// /dev_hdd0/data/quake2/baseq2/, which is executed after this file.
// START always opens the menu.
// (No semicolons in these comments: the console splits commands on them,
// even inside a comment.)
//

bind	BTN_SOUTH	+moveup
bind	BTN_EAST	+movedown
bind	BTN_WEST	invuse
bind	BTN_NORTH	inven
bind	SHOULDR_LEFT	weapprev
bind	SHOULDR_RIGHT	weapnext
bind	TRIG_LEFT	+speed
bind	TRIG_RIGHT	+attack
bind	DP_UP		weaplast
bind	DP_DOWN		"echo Quick Saving...; wait; save quick"
bind	DP_LEFT		invprev
bind	DP_RIGHT	invnext
bind	STICK_LEFT	+speed
bind	STICK_RIGHT	centerview
bind	BTN_BACK	"cmd help"

// Renderer: gl1 = OpenGL drawn by the RSX (default), soft = software
// drawn by the CPU. Both draw at an internal resolution (r_mode, or
// r_customwidth x r_customheight with r_mode -1) scaled to the TV.
set	vid_renderer	gl1
set	r_mode		-1
set	r_customwidth	1280
set	r_customheight	720
set	gl1_tilerendering	1
set	cl_async	0
set	vid_maxfps	60

